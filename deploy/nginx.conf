upstream video_clipper_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Must be >= VC_MAX_UPLOAD_BYTES so large uploads reach the app.
    client_max_body_size 500m;

    # Frontend static build.
    root /srv/video-clipper/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://video_clipper_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long encodes and SSE streaming.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Optional: serve processed media directly (kept internal until auth is added).
    location /media/ {
        internal;
        alias /srv/video-clipper/data/;
    }

    access_log /var/log/nginx/video-clipper.access.log;
    error_log /var/log/nginx/video-clipper.error.log;
}
